<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Test Tool</title>
    <style>
     body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
     .container { max-width: 800px; width: 100%; text-align: center; }
     
     /* 映像・音声ビジュアライザーのレイアウト */
     .preview-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
     video { width: 100%; display: block; background: #222; }
     canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; pointer-events: none; }

     /* コントロール系 */
     .controls { margin-top: 20px; gap: 10px; display: flex; justify-content: center; }
     button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; font-weight: bold; }
     #startBtn { background: #e74c3c; color: white; }
     #startBtn:disabled { background: #555; cursor: not-allowed; }
     #stopBtn { background: #f1c40f; color: #333; }
     #stopBtn:disabled { background: #555; cursor: not-allowed; }
     
     .status { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
  </head>
  <body>

    <div class="container">
      <h2>Device Tester</h2>
      
      <div class="preview-box">
        <video id="preview" autoplay muted playsinline></video>
        <canvas id="visualizer"></canvas>
      </div>

      <div class="controls">
        <button id="startBtn">録画開始</button>
        <button id="stopBtn" disabled>停止 & 保存</button>
      </div>
      <div class="status" id="statusText">カメラとマイクの使用を許可してください</div>
    </div>

    <script>
     const video = document.getElementById('preview');
     const canvas = document.getElementById('visualizer');
     const canvasCtx = canvas.getContext('2d');
     const startBtn = document.getElementById('startBtn');
     const stopBtn = document.getElementById('stopBtn');
     const statusText = document.getElementById('statusText');

     let mediaRecorder;
     let recordedChunks = [];
     let audioContext;
     let analyser;
     let animationId;

     // 初期化: カメラとマイクのストリームを取得
     async function init() {
       try {
         const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
         video.srcObject = stream;
         setupVisualizer(stream);
         setupRecorder(stream);
         statusText.innerText = "準備完了";
       } catch (err) {
         statusText.innerText = "エラー: デバイスにアクセスできません。" + err.message;
         startBtn.disabled = true;
       }
     }

     // 音声の波形表示 (Web Audio API)
     function setupVisualizer(stream) {
       audioContext = new (window.AudioContext || window.webkitAudioContext)();
       const source = audioContext.createMediaStreamSource(stream);
       analyser = audioContext.createAnalyser();
       analyser.fftSize = 256;
       source.connect(analyser);

       const bufferLength = analyser.frequencyBinCount;
       const dataArray = new Uint8Array(bufferLength);

       function draw() {
         animationId = requestAnimationFrame(draw);
         analyser.getByteFrequencyData(dataArray);

         canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
         canvasCtx.fillStyle = 'rgba(46, 204, 113, 0.5)'; // 緑色の波形

         const barWidth = (canvas.width / bufferLength) * 2.5;
         let x = 0;

         for (let i = 0; i < bufferLength; i++) {
           const barHeight = dataArray[i] / 2;
           canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
           x += barWidth + 1;
         }
       }
       draw();
     }

     // 録画機能のセットアップ (MediaRecorder API)
     function setupRecorder(stream) {
       mediaRecorder = new MediaRecorder(stream);

       mediaRecorder.ondataavailable = (e) => {
         if (e.data.size > 0) recordedChunks.push(e.data);
       };

       mediaRecorder.onstop = () => {
         const blob = new Blob(recordedChunks, { type: 'video/webm' });
         const url = URL.createObjectURL(blob);
         const a = document.createElement('a');
         a.href = url;
         a.download = `test-recording-${new Date().getTime()}.webm`;
         a.click();
         recordedChunks = [];
         statusText.innerText = "保存完了！";
       };
     }

     // イベントリスナー
     startBtn.onclick = () => {
       recordedChunks = [];
       mediaRecorder.start();
       startBtn.disabled = true;
       stopBtn.disabled = false;
       statusText.innerText = "録画中...";
     };

     stopBtn.onclick = () => {
       mediaRecorder.stop();
       startBtn.disabled = false;
       stopBtn.disabled = true;
       statusText.innerText = "処理中...";
     };

     // 起動
     init();
    </script>

  </body>
</html>
